name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install EPUBCheck
        run: |
          mkdir -p .epubcheck
          curl --fail --location --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o .epubcheck/release.zip
          unzip -q .epubcheck/release.zip -d .epubcheck
      - run: npm run test:epub
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reader-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
